# Supervised single-node deployment of Infinite Loop.
# Full guide: docs/deployment.md
#
# Quick start:
#   cp .env.example .env
#   echo "INFLOOP_API_TOKEN=$(openssl rand -hex 32)" >> .env
#   docker compose up -d --build

services:
  infinite-loop:
    build:
      # Bun version is pinned in the Dockerfile (ARG BUN_VERSION).
      context: .
    image: infinite-loop:local

    # Restart after any abnormal exit. This is what makes boot-time crash
    # recovery actually run: an uncaughtException makes the process exit(1),
    # the container restarts, and the next boot reaps orphaned agent CLIs and
    # reconciles interrupted runs. `unless-stopped` keeps it down only when an
    # operator explicitly stops it.
    restart: unless-stopped

    # Run a real init (tini) as PID 1. Infinite Loop spawns detached
    # provider/script child processes; tini reaps the ones re-parented to
    # PID 1 instead of leaving zombies.
    init: true

    # Published to the host loopback only. Put a reverse proxy or tunnel in
    # front for real access (see docs/security.md). To expose directly on the
    # LAN, change this to "3000:3000" — trusted networks only.
    ports:
      - "127.0.0.1:3000:3000"

    # --- Containment hardening ---------------------------------------------
    # The container is the security boundary for the untrusted code this app
    # runs: provider CLIs and inline TS/Python, looping autonomously and
    # routinely shaped by webhook payloads. These settings bound the blast
    # radius of a compromised run. See docs/security.md.
    #
    # NOT covered here: per-agent-run network isolation. The orchestrator
    # itself needs egress (provider APIs, webhook responses), so the whole
    # container cannot run `--network none`. Isolating an individual agent
    # run's network requires nested sandboxing and is a tracked gap — keep
    # the container off any network it should not reach, and review the
    # workflows you run (docs/security.md).
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Cap the process table so a fork bomb in a run can't exhaust host PIDs.
    # Generous: the orchestrator plus several parallel agent subprocess trees.
    pids_limit: 4096

    # Cap memory and CPU. The orchestrator's own heap is bounded
    # (INFLOOP_MAX_TOTAL_EVENT_BUFFER), but the agent CLIs it spawns are not —
    # a ballooning provider child, or a loop spawning agents, can otherwise
    # consume the whole host. With a cgroup limit a runaway run is OOM-killed
    # inside this container instead of dragging the host into swap or letting
    # the host kernel's OOM-killer pick an unrelated victim; `restart:
    # unless-stopped` plus boot-time crash recovery then reconciles. Setting
    # memswap_limit equal to mem_limit denies the container swap, so mem_limit
    # is a hard ceiling. Tune both to the host and INFLOOP_MAX_CONCURRENT_RUNS.
    # Caveats: the tmpfs mounts below (~768m) also count against mem_limit, and
    # the no-swap guarantee needs host-kernel swap accounting. See
    # docs/configuration.md#container-resource-limits.
    mem_limit: ${INFLOOP_MEM_LIMIT:-4g}
    memswap_limit: ${INFLOOP_MEM_LIMIT:-4g}
    cpus: ${INFLOOP_CPUS:-2.0}

    # Writable scratch on the otherwise read-only root filesystem. The app
    # writes only here and to the named volumes below: script wrappers and
    # per-run mcp.json land in the system temp dir; Next.js may write an
    # image-optimization cache.
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /app/.next/cache:mode=1777,size=256m

    environment:
      # Bind every interface *inside the container* so the published port can
      # reach the app. Real network exposure is governed by `ports` above,
      # not by this. See docs/deployment.md#how-network-exposure-works.
      HOST: "0.0.0.0"
      INFLOOP_DATA_DIR: /data
      # The scheduled-backup sidecar writes archives here; the app mounts the
      # same volume read-only (see `volumes` below) and reads it only to derive
      # infloop_backup_last_success_timestamp_seconds on /api/metrics — the
      # gauge InfiniteLoopBackupStale alerts on. Must match the sidecar's value.
      INFLOOP_BACKUP_DIR: /backups
      INFLOOP_LOG_LEVEL: ${INFLOOP_LOG_LEVEL:-info}
      # Required: the network-posture gate refuses a non-loopback bind with no
      # token. `docker compose up` fails fast if INFLOOP_API_TOKEN is unset.
      INFLOOP_API_TOKEN: ${INFLOOP_API_TOKEN:?set INFLOOP_API_TOKEN in .env — see docs/deployment.md}
      # Optional: extra host env vars to expose to spawned agent/script
      # children (comma-separated names or PREFIX_* wildcards). The child env
      # is otherwise scrubbed to a non-secret allowlist. See docs/security.md.
      INFLOOP_CHILD_ENV_PASSTHROUGH: ${INFLOOP_CHILD_ENV_PASSTHROUGH:-}
      # Optional: process-wide cost ceiling in USD. Once cumulative provider-
      # reported cost since startup exceeds it, new runs are refused and any
      # in-flight run is aborted at its next costed node. `0` (default)
      # disables it. See docs/configuration.md.
      INFLOOP_MAX_TOTAL_COST_USD: ${INFLOOP_MAX_TOTAL_COST_USD:-0}
      # Optional operator knobs. Every one is documented in .env.example and
      # read by the app, but a container only sees what is listed here — so
      # without these lines a value set in .env was silently ignored (caught
      # by the production burn-in). Each is passed through empty when unset in
      # .env; the app then applies its documented default. Run-level and
      # webhook/login safety ceilings, plus concurrency and the in-memory
      # event-buffer cap. See docs/configuration.md.
      INFLOOP_MAX_CONCURRENT_RUNS: ${INFLOOP_MAX_CONCURRENT_RUNS:-}
      INFLOOP_MAX_TOTAL_EVENT_BUFFER: ${INFLOOP_MAX_TOTAL_EVENT_BUFFER:-}
      INFLOOP_MAX_RUN_NODE_EXECUTIONS: ${INFLOOP_MAX_RUN_NODE_EXECUTIONS:-}
      INFLOOP_MAX_RUN_DURATION_MS: ${INFLOOP_MAX_RUN_DURATION_MS:-}
      INFLOOP_MAX_RUN_COST_USD: ${INFLOOP_MAX_RUN_COST_USD:-}
      INFLOOP_WEBHOOK_RATE_LIMIT: ${INFLOOP_WEBHOOK_RATE_LIMIT:-}
      INFLOOP_LOGIN_RATE_LIMIT: ${INFLOOP_LOGIN_RATE_LIMIT:-}
      INFLOOP_EGRESS_ENFORCE: ${INFLOOP_EGRESS_ENFORCE:-}

    volumes:
      # All persistent state (run history, saved workflows, triggers,
      # connections, the audit log, crash-recovery markers) lives here and
      # survives restarts and rebuilds. The shipped library presets are baked
      # into the image, not stored here.
      - infinite-loop-data:/data
      # $HOME for the unprivileged `bun` user — writable on the read-only
      # root so agent CLIs spawned inside the container (Claude Code, git)
      # can persist their config/credentials across restarts.
      - infinite-loop-home:/home/bun
      # The backup sidecar's archive volume, READ-ONLY. The app never writes
      # here — it only stats the newest archive to expose backup freshness as
      # infloop_backup_last_success_timestamp_seconds. A bug in that read path
      # therefore cannot corrupt a backup. INFLOOP_BACKUP_DIR above points here.
      - infinite-loop-backups:/backups:ro

  # --- Scheduled backups -----------------------------------------------------
  # Periodic, retained snapshots of the data volume. `bun run backup` alone is
  # a MANUAL step — without this service the recovery point is only ever as
  # fresh as the last time an operator remembered to run it. This sidecar runs
  # scripts/scheduled-backup.ts: it snapshots the data dir immediately on
  # start, then every INFLOOP_BACKUP_INTERVAL_HOURS, and prunes the backup
  # directory to INFLOOP_BACKUP_KEEP generations after each one.
  # See docs/backup-restore.md#automated-backups.
  backup:
    # The same image as the app — this service only runs a script, never the
    # server. `build` is declared so a plain `docker compose up` builds it; the
    # shared image tag makes the second build a near-instant cache hit.
    build:
      context: .
    image: infinite-loop:local

    # Restart after any abnormal exit so the schedule survives a crash. A
    # FAILED backup is not an exit — the script logs it and waits for the next
    # interval — so a transient error cannot crash-loop this container.
    restart: unless-stopped

    # Reap the `tar` / `gzip` children each snapshot spawns.
    init: true

    command: ["bun", "scripts/scheduled-backup.ts"]

    # --- Containment hardening (mirrors the app service) ---------------------
    # The sidecar needs no network and spawns only `tar`/`gzip`; lock it down.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

    environment:
      INFLOOP_DATA_DIR: /data
      INFLOOP_LOG_LEVEL: ${INFLOOP_LOG_LEVEL:-info}
      # Archives are written here — a SEPARATE volume from the data dir, so a
      # deleted or corrupted data volume does not take the backups with it.
      INFLOOP_BACKUP_DIR: /backups
      # Optional operator knobs, documented in .env.example. Passed through
      # empty when unset in .env; the script then applies its default
      # (every 24h, keep 7 generations).
      INFLOOP_BACKUP_INTERVAL_HOURS: ${INFLOOP_BACKUP_INTERVAL_HOURS:-}
      INFLOOP_BACKUP_KEEP: ${INFLOOP_BACKUP_KEEP:-}

    # createBackup stages its manifest and lets `tar` use the system temp dir;
    # both land here on the otherwise read-only root filesystem.
    tmpfs:
      - /tmp:mode=1777,size=256m

    volumes:
      # The data volume, READ-ONLY: a backup only ever reads it, so a bug in
      # this sidecar can never corrupt live data.
      - infinite-loop-data:/data:ro
      # The archives — a dedicated volume, separate from the data volume (see
      # INFLOOP_BACKUP_DIR above). Still on the same host: for true disaster
      # recovery copy these off-host (docs/backup-restore.md#automated-backups).
      - infinite-loop-backups:/backups

volumes:
  infinite-loop-data:
  infinite-loop-home:
  infinite-loop-backups:
