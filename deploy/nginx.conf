# Reverse-proxy config for the Infinite Loop burn-in (docs/burn-in.md).
# Loaded by the `proxy` service in deploy/docker-compose.observability.yml.
#
# Its job is narrow: be ONE real proxy hop in front of the app so burn-in
# Phase 0 can prove "the UI loads behind a reverse proxy". It serves plain
# HTTP — a production deployment terminates TLS here instead and forwards
# `X-Forwarded-Proto: https` (Infinite Loop reads it to mark the session
# cookie Secure); see docs/deployment.md#putting-it-behind-a-proxy.

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS. Resolving the upstream at request time (via the
  # $upstream variable below) means this proxy survives the app container
  # being restarted with a new IP — which burn-in Phase 3.1 and 3.9 do.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Webhook and MCP payloads can exceed nginx's 1m default; don't let the
  # proxy be the surface that rejects them.
  client_max_body_size 25m;

  server {
    listen 8080;

    # Lets the compose healthcheck verify the proxy itself, separately from
    # whether the app upstream is up.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      # A variable in proxy_pass forces per-request DNS resolution (see the
      # resolver above). $request_uri forwards the original URI verbatim —
      # nginx does not decode/re-encode it, so encoded characters in webhook
      # trigger paths reach the app untouched. That transparency is intended.
      set $upstream infinite-loop:3000;
      proxy_pass http://$upstream$request_uri;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # /api/events streams Server-Sent Events — never buffer the response,
      # and allow a long-lived connection.
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_read_timeout 1h;
    }
  }
}
